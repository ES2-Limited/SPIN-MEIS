services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: spin_meis_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: spin_meis
      DB_USERNAME: spin_meis
      DB_PASSWORD: secret
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    image: nginx:1.27-alpine
    container_name: spin_meis_web
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: spin_meis_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: spin_meis
      POSTGRES_USER: spin_meis
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spin_meis -d spin_meis"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: spin_meis_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
